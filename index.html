<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snooker Team Picker</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b5d1e;
    color:white;
    text-align:center;
    padding:20px;
}

h1{
    color:#ffd700;
}

.card{
    background:#146b2e;
    border-radius:15px;
    padding:20px;
    margin:15px auto;
    max-width:400px;
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
}

.team{
    font-size:1.4em;
    margin:15px 0;
}

button{
    background:#ffd700;
    color:black;
    border:none;
    border-radius:10px;
    padding:15px 25px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin:5px;
}

.history{
    text-align:left;
    max-width:400px;
    margin:20px auto;
}

.history-item{
    background:#0f4a1a;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
}
</style>
</head>

<body>

<h1>🎱 Snooker Team Picker</h1>

<div class="card">
    <button onclick="pickTeams()">Pick Teams</button>
    <button onclick="clearHistory()">Clear History</button>

    <div id="result"></div>
</div>

<div class="history">
    <h2>Previous Draws</h2>
    <div id="history"></div>
</div>

<script>

const players = [
    "John",
    "Craig",
    "Ben",
    "Andy"
];

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
    return array;
}

function pickTeams(){

    const shuffled = shuffle([...players]);

    const team1 = `${shuffled[0]} & ${shuffled[1]}`;
    const team2 = `${shuffled[2]} & ${shuffled[3]}`;

    document.getElementById("result").innerHTML = `
        <div class="team">🔴 Team 1<br><strong>${team1}</strong></div>
        <div class="team">⚫ Team 2<br><strong>${team2}</strong></div>
    `;

    const draw = {
        date: new Date().toLocaleDateString("en-GB"),
        team1,
        team2
    };

    let history = JSON.parse(localStorage.getItem("snookerHistory")) || [];
    history.unshift(draw);

    if(history.length > 20){
        history = history.slice(0,20);
    }

    localStorage.setItem("snookerHistory", JSON.stringify(history));

    loadHistory();
}

function loadHistory(){

    const history = JSON.parse(localStorage.getItem("snookerHistory")) || [];

    document.getElementById("history").innerHTML =
        history.map(item => `
            <div class="history-item">
                <strong>${item.date}</strong><br>
                🔴 ${item.team1}<br>
                ⚫ ${item.team2}
            </div>
        `).join("");
}

function clearHistory(){
    localStorage.removeItem("snookerHistory");
    loadHistory();
}

loadHistory();

</script>

</body>
</html>

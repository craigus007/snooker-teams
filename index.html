<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snooker Team Picker</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b5d1e;
    color:white;
    text-align:center;
    padding:20px;
}

h1{
    color:#ffd700;
}

.card{
    background:#146b2e;
    border-radius:15px;
    padding:20px;
    margin:15px auto;
    max-width:450px;
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
}

.players{
    text-align:left;
    max-width:250px;
    margin:0 auto 20px;
}

.players label{
    display:block;
    padding:6px;
    font-size:18px;
}

button{
    background:#ffd700;
    color:black;
    border:none;
    border-radius:10px;
    padding:15px 25px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin:5px;
}

.result{
    margin-top:20px;
    font-size:20px;
    line-height:1.8;
}

.history{
    text-align:left;
    max-width:450px;
    margin:20px auto;
}

.history-item{
    background:#0f4a1a;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
}
</style>
</head>

<body>

<h1>🎱 Snooker Night</h1>

<div class="card">

    <h3>Who's Playing?</h3>

    <div class="players">
        <label><input type="checkbox" value="John" checked> John</label>
        <label><input type="checkbox" value="Craig" checked> Craig</label>
        <label><input type="checkbox" value="Ben" checked> Ben</label>
        <label><input type="checkbox" value="Andy" checked> Andy</label>
    </div>

    <button onclick="generate()">Generate</button>
    <button onclick="clearHistory()">Clear History</button>

    <div id="result" class="result"></div>

</div>

<div class="history">
    <h2>History</h2>
    <div id="history"></div>
</div>

<script>

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
    return array;
}

function generate(){

    const selected =
        [...document.querySelectorAll('input[type="checkbox"\]:checked')]
        .map(cb => cb.value);

    if(selected.length < 3){
        alert("Please select at least 3 players.");
        return;
    }

    const shuffled = shuffle([...selected]);

    let resultHTML = "";
    let historyText = "";

    if(selected.length === 3){

        resultHTML = `
            <h3>🎯 Order of Play</h3>
            1️⃣ ${shuffled[0]}<br>
            2️⃣ ${shuffled[1]}<br>
            3️⃣ ${shuffled[2]}
        `;

        historyText =
            `Order: ${shuffled[0]}, ${shuffled[1]}, ${shuffled[2]}`;

    } else if(selected.length === 4){

        resultHTML = `
            <h3>🎱 Teams</h3>
            🔴 ${shuffled[0]} & ${shuffled[1]}<br><br>
            ⚫ ${shuffled[2]} & ${shuffled[3]}
        `;

        historyText =
            `${shuffled[0]} & ${shuffled[1]} v ${shuffled[2]} & ${shuffled[3]}`;
    }

    document.getElementById("result").innerHTML = resultHTML;

    const history = JSON.parse(
        localStorage.getItem("snookerHistory") || "[]"
    );

    history.unshift({
        date: new Date().toLocaleDateString("en-GB"),
        result: historyText
    });

    localStorage.setItem(
        "snookerHistory",
        JSON.stringify(history)
    );

    loadHistory();
}

function loadHistory(){

    const history = JSON.parse(
        localStorage.getItem("snookerHistory") || "[]"
    );

    document.getElementById("history").innerHTML =
        history.map(item => `
            <div class="history-item">
                <strong>${item.date}</strong><br>
                ${item.result}
            </div>
        `).join("");
}

function clearHistory(){

    localStorage.removeItem("snookerHistory");
    loadHistory();
}

loadHistory();

</script>

</body>
</html>
